services:
  - type: web
    name: freightbooks
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "7331"
      - key: SELF_HOSTED_MODE
        value: "true"
      - key: REQUIRE_LICENSE_KEY
        value: "true"
      - key: UPLOAD_PATH
        value: /app/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: freightbooks-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        value: ""
      - key: RESEND_FROM_EMAIL
        value: "FreightBooks <noreply@localhost>"
    disk:
      name: uploads
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: freightbooks-db
    plan: free
    databaseName: freightbooks
    user: freightbooks
